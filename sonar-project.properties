# Project info
sonar.organization=vws
sonar.projectKey=nl-rdo-dusi-portal-web-frontend
sonar.projectName=nl-rdo-dusi-portal-web-frontend

# Info links shown in SonarCloud
sonar.links.homepage=https://github.com/minvws/nl-rdo-dusi-portal-web-frontend-private

# Source encoding
sonar.sourceEncoding=UTF-8

# Analysis scoping
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts
sonar.testExecutionReportPaths=sonar-report.xml

# Code coverage
sonar.coverage.exclusions=
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Duplication exclusions
sonar.cpd.exclusions=
