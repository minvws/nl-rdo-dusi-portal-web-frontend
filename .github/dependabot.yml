version: 2
registries:
  npm-github:
    type: npm-registry
    url: "https://npm.pkg.github.com"
    token: ${{ secrets.REPO_READ_ONLY_TOKEN }}

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    registries:
      - npm-github
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
