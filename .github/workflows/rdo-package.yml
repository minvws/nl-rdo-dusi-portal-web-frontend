name: Create RDO MaZi Package

on:
  push:
    tags:
      - v*

jobs:
  build-mazi:
    runs-on: ubuntu-20.04
    steps:
      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REPO_READ_ONLY_TOKEN }}

      - name: Add Generic env
        run: 'echo "VITE_API_BASE_URL=/bff" > .env'

      - name: NPM build
        run: npm run build-only

      - name: Clean build
        run: rm -r node_modules .git

      - name: Add version.json
        run: 'echo "{ \"version\": \"${{ env.RELEASE_VERSION }}\", \"git_ref\": \"$GITHUB_SHA\"}" > dist/version.json'
        shell: bash

      - name: Temporarily add mocks
        run: cp mock/ dist/ -R

      - name: Create tar
        run: tar -C dist -czf ${{ github.event.repository.name }}_${{ env.RELEASE_VERSION }}.tar.gz ./assets ./icons ./img ./mock ./site.webmanifest ./index.html

      - name: Upload release tar
        uses: actions/upload-artifact@v3
        with:
          name: ${{ github.event.repository.name }}_${{ env.RELEASE_VERSION }}
          path: ${{ github.event.repository.name }}_${{ env.RELEASE_VERSION }}.tar.gz
